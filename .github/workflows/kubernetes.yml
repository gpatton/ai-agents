
name: AgentForge Kubernetes Integration

on:
  workflow_dispatch:

jobs:
  kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest requests

      - name: Create temporary test configuration
        run: |
          echo "OPENAI_API_KEY=ci-placeholder-not-a-real-key" >> .env
          echo "POSTGRES_PASSWORD=agentforge-ci-test" >> .env
          echo "CLERK_ISSUER=https://clerk.example.test" >> .env

      - name: Build backend image
        run: docker build -t agentforge:latest .

      - name: Build frontend image
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          docker build \
            --build-arg VITE_API_URL=http://127.0.0.1:8002 \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" \
            -t agentforge-frontend:k8s \
            ./frontend

      - name: Create Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: agentforge

      - name: Deploy AgentForge
        run: bash scripts/deploy-k8s.sh

      - name: Start port forwarding
        run: |
          kubectl port-forward -n agentforge \
            service/agentforge 8002:8000 \
            > /tmp/agentforge-backend.log 2>&1 &

          kubectl port-forward -n agentforge \
            service/agentforge-frontend 8081:80 \
            > /tmp/agentforge-frontend.log 2>&1 &

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8002/ready \
              && curl -fsS http://127.0.0.1:8081/; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run Kubernetes integration tests
        run: |
          python -m pytest -v -m integration

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl get pods -n agentforge
          kubectl describe pods -n agentforge
          kubectl logs -n agentforge deployment/agentforge \
            --tail=100

