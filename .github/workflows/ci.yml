
name: AgentForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          CLERK_ISSUER: "https://clerk.example.test"
        run: |
          python -m pytest -v -m "not integration"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  security:
    name: Docker security scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t agentforge:security .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: agentforge:security
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://127.0.0.1:8000 \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_test_Y2xlcmsuZXhhbXBsZS50ZXN0JA \
            -t agentforge-frontend:security \
            ./frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: agentforge-frontend:security
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
