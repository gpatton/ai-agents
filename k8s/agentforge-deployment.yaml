apiVersion: apps/v1
kind: Deployment

metadata:
  name: agentforge
  namespace: agentforge

spec:
  replicas: 1

  selector:
    matchLabels:
      app: agentforge

  template:
    metadata:
      labels:
        app: agentforge

    spec:
      securityContext:
        fsGroup: 10001

      containers:
        - name: agentforge
          image: agentforge:latest
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          ports:
            - containerPort: 8000

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 3

          env:
            - name: CLERK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: agentforge-config
                  key: CLERK_ISSUER

            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:8081,http://127.0.0.1:8081"

            - name: CLERK_ALLOWED_AUTHORIZED_PARTIES
              value: "http://localhost:8081,http://127.0.0.1:8081"

            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentforge-secrets
                  key: OPENAI_API_KEY

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentforge-secrets
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentforge-db-url
                  key: DATABASE_URL

          volumeMounts:
            - name: chroma-data
              mountPath: /app/chroma_db

      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: chroma-data
