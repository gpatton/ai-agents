apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentforge-frontend
  namespace: agentforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentforge-frontend
  template:
    metadata:
      labels:
        app: agentforge-frontend
    spec:
      containers:
        - name: frontend
          image: agentforge-frontend:k8s
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
