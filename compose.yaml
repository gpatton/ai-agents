services:
  postgres:
    image: postgres:17
    container_name: agentforge-postgres
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - agentforge_postgres:/var/lib/postgresql/data

  agentforge:
    build:
      context: .
    image: agentforge:latest
    container_name: agentforge
    dns_search:
      - .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agentforge:agentforge@postgres:5432/agentforge
    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  agentforge_chroma:
  agentforge_postgres:
