services:
  agentforge:
    build:
      context: .
    image: agentforge:latest
    container_name: agentforge
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

    volumes:
      - agentforge_chroma:/app/chroma_db

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  agentforge_chroma:
